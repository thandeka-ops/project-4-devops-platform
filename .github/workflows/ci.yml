
name: Project 4 CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://pypi.org/simple -r application/requirements.txt pytest

      - name: Run automated tests
        working-directory: application
        run: |
          python -m pytest -v

      - name: Build Docker image
        run: |
          docker build -t project4-app:ci ./application
